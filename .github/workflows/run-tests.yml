name: Run tests

on:
  push: {}
  pull_request: {}

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: |
          uv sync

      - name: Run tests
        run: |
          uv run pytest tests -q
