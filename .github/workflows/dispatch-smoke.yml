name: dispatch-smoke

on:
  workflow_dispatch:
    inputs:
      deployParamsFile:
        description: "Path to .bicepparam file"
        required: true
        default: "infra/bicep/params/prod.bicepparam"

permissions:
  contents: read

jobs:
  validate-bicep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/bicep" \
            https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x "${RUNNER_TEMP}/bicep"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
          bicep --version

      - name: Print inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "deployParamsFile=${{ inputs.deployParamsFile }}"

      - name: Validate referenced files exist
        shell: bash
        run: |
          set -euo pipefail
          test -f "infra/bicep/main.bicep"
          test -f "${{ inputs.deployParamsFile }}"
          echo "OK: files exist"

      - name: Compile Bicep template
        shell: bash
        run: |
          set -euo pipefail
          bicep --version
          bicep build "infra/bicep/main.bicep" --outfile "${RUNNER_TEMP}/main.json"
          echo "OK: compiled main.bicep"

      - name: Compile Bicep parameters
        shell: bash
        run: |
          set -euo pipefail
          bicep build-params "${{ inputs.deployParamsFile }}" --outfile "${RUNNER_TEMP}/params.json"
          echo "OK: compiled bicepparam"
