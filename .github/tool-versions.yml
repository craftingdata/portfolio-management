# Canonical tool/dependency version pointers for documentation resolution.
#
# Goal: prevent drift by pointing to the repo's authoritative manifests.
# Update versions in `pyproject.toml` / `uv.lock` / `deploy/aca/broker/Dockerfile` instead of editing this file.

schema_version: 1
updated_by: "autogenerated-pointer"

python:
  manager: uv
  python_constraint: ">=3.12"
  manifests:
    - path: "pyproject.toml"
      role: "constraints"
    - path: "uv.lock"
      role: "resolved"
  notes:
    - "Use uv.lock for exact resolved versions when retrieving documentation and changelogs."

containers:
  - dockerfile: "deploy/aca/broker/Dockerfile"
    base_image: "See Dockerfile"
    os_context:
      distro_hint: "Resolve from deploy/aca/broker/Dockerfile"
    system_packages:
      - name: "Review deploy/aca/broker/Dockerfile for current packages"
        source: "dockerfile"

sources:
  - path: "pyproject.toml"
    kind: "python_manifest"
  - path: "uv.lock"
    kind: "python_lock"
  - path: "deploy/aca/broker/Dockerfile"
    kind: "container_build"
